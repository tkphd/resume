- name: High Performance Computing for Boundary Value Problems
  url: https://hiperc.readthedocs.io
  nickname: HiPerC
  role: Creator
  start: 2018
  until: Present
  summary: >
    Apples-to-apples comparison of CUDA, OpenCL, and OpenACC graphics card computing frameworks
    solving a canonical diffusion problem. Carefully documented to help fellow materials scientists
    learn how to use these ubiquitous high-performance resources.

